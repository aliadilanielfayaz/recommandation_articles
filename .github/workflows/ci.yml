# Nom du workflow
name: Python CI

# Déclencheurs : Exécute le workflow sur push ou pull request vers la branche 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissions (optionnel mais bonne pratique pour la sécurité)
permissions:
  contents: read

# Définition des jobs
jobs:
  build:
    # Runner : Utilise la dernière version d'Ubuntu
    runs-on: ubuntu-latest

    # Étapes du job
    steps:
    # 1. Récupérer le code du dépôt
    - uses: actions/checkout@v4

    # 2. Configurer l'environnement Python (utiliser la version que vous utilisez, ex: 3.10)
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Installer les dépendances
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installer flake8 en plus des dépendances du projet
        pip install flake8
        pip install -r requirements.txt

    # 4. Linter avec flake8
    - name: Lint with flake8
      run: |
        # Arrêter le build si des erreurs ou avertissements Python sont trouvés (erreurs=E, avertissements=W)
        # Ignorer certaines erreurs si nécessaire (ex: E501 line too long)
        # --count affiche le nombre total d'erreurs/avertissements
        # --show-source affiche la ligne de code concernée
        # --statistics affiche des statistiques
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exécuter flake8 une deuxième fois pour vérifier le style mais ne pas faire échouer le build pour ça
        # Vous pouvez ajuster les options --ignore ou --select selon vos préférences
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 4. Exécuter les tests unitaires
    - name: Run tests
      run: |
        python -m unittest discover tests