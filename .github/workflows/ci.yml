# Nom du workflow
name: Python CI

# Déclencheurs : Exécute le workflow sur push ou pull request vers la branche 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissions (optionnel mais bonne pratique pour la sécurité)
permissions:
  contents: read

# Définition des jobs
jobs:
  build:
    # Runner : Utilise la dernière version d'Ubuntu
    runs-on: ubuntu-latest

    # Étapes du job
    steps:
    # 1. Récupérer le code du dépôt
    - uses: actions/checkout@v4

    # 2. Configurer l'environnement Python (utiliser la version que vous utilisez, ex: 3.10)
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Installer les dépendances
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Exécuter les tests unitaires
    - name: Run tests
      run: |
        python -m unittest discover tests